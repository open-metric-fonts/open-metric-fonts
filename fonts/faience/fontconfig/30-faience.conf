<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Amasis MT Pro Black</family>
    <accept><family>Faience Black</family></accept>
  </alias>
  <alias binding="same">
    <family>Amasis MT Pro Light</family>
    <accept><family>Faience Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Amasis MT Pro</family>
    <accept><family>Faience</family></accept>
  </alias>
</fontconfig>
