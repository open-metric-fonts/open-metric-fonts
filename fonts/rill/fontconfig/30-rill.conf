<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Gill Sans MT Ext Condensed Bold</family>
    <accept><family>Rill Ext Condensed Bold</family></accept>
  </alias>
  <alias binding="same">
    <family>Gill Sans Ultra Bold Condensed</family>
    <accept><family>Rill Ultra Bold Condensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Gill Sans MT Condensed</family>
    <accept><family>Rill Condensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Gill Sans Ultra Bold</family>
    <accept><family>Rill Ultra Bold</family></accept>
  </alias>
  <alias binding="same">
    <family>Gill Sans MT</family>
    <accept><family>Rill</family></accept>
  </alias>
</fontconfig>
