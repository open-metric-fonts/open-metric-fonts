<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Verdana Pro Semibold</family>
    <accept><family>Glade Pro Semibold</family></accept>
  </alias>
  <alias binding="same">
    <family>Verdana Pro Black</family>
    <accept><family>Glade Pro Black</family></accept>
  </alias>
  <alias binding="same">
    <family>Verdana Pro Light</family>
    <accept><family>Glade Pro Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Verdana Pro Cond</family>
    <accept><family>Glade Pro Cond</family></accept>
  </alias>
  <alias binding="same">
    <family>Verdana Pro</family>
    <accept><family>Glade Pro</family></accept>
  </alias>
</fontconfig>
