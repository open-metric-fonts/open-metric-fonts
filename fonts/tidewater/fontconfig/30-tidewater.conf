<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Seaford Display</family>
    <accept><family>Tidewater Display</family></accept>
  </alias>
  <alias binding="same">
    <family>Seaford</family>
    <accept><family>Tidewater</family></accept>
  </alias>
</fontconfig>
