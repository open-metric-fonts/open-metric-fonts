<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Daytona Condensed</family>
    <accept><family>Pitlane Condensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Daytona Light</family>
    <accept><family>Pitlane Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Daytona</family>
    <accept><family>Pitlane</family></accept>
  </alias>
</fontconfig>
