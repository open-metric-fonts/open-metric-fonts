<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Univers Condensed Light</family>
    <accept><family>Orbis Condensed Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Univers Condensed</family>
    <accept><family>Orbis Condensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Univers Light</family>
    <accept><family>Orbis Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Univers</family>
    <accept><family>Orbis</family></accept>
  </alias>
</fontconfig>
