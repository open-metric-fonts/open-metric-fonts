<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Georgia Pro Semibold</family>
    <accept><family>Peachtree Semibold</family></accept>
  </alias>
  <alias binding="same">
    <family>Georgia Pro Black</family>
    <accept><family>Peachtree Black</family></accept>
  </alias>
  <alias binding="same">
    <family>Georgia Pro Light</family>
    <accept><family>Peachtree Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Georgia Pro Cond</family>
    <accept><family>Peachtree Cond</family></accept>
  </alias>
  <alias binding="same">
    <family>Georgia Pro</family>
    <accept><family>Peachtree</family></accept>
  </alias>
</fontconfig>
