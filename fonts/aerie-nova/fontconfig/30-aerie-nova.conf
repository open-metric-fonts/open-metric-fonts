<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Arial Nova Cond Light</family>
    <accept><family>Aerie Nova Cond Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Arial Nova Light</family>
    <accept><family>Aerie Nova Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Arial Nova Cond</family>
    <accept><family>Aerie Nova Cond</family></accept>
  </alias>
  <alias binding="same">
    <family>Arial Nova</family>
    <accept><family>Aerie Nova</family></accept>
  </alias>
</fontconfig>
