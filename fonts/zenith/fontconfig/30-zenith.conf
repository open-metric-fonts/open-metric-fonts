<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Tw Cen MT Condensed Extra Bold</family>
    <accept><family>Zenith Condensed Extra Bold</family></accept>
  </alias>
  <alias binding="same">
    <family>Tw Cen MT Condensed</family>
    <accept><family>Zenith Condensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Tw Cen MT</family>
    <accept><family>Zenith</family></accept>
  </alias>
</fontconfig>
