<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Walbaum Display</family>
    <accept><family>Weimar Display</family></accept>
  </alias>
  <alias binding="same">
    <family>Walbaum Heading</family>
    <accept><family>Weimar Heading</family></accept>
  </alias>
  <alias binding="same">
    <family>Walbaum Text</family>
    <accept><family>Weimar Text</family></accept>
  </alias>
  <alias binding="same">
    <family>Walbaum</family>
    <accept><family>Weimar</family></accept>
  </alias>
</fontconfig>
