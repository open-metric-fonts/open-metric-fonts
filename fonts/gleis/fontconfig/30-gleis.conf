<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Bahnschrift SemiLight SemiCondensed</family>
    <accept><family>Gleis SemiLight SemiCondensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Bahnschrift SemiBold SemiCondensed</family>
    <accept><family>Gleis SemiBold SemiCondensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Bahnschrift Light SemiCondensed</family>
    <accept><family>Gleis Light SemiCondensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Bahnschrift SemiLight Condensed</family>
    <accept><family>Gleis SemiLight Condensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Bahnschrift SemiBold Condensed</family>
    <accept><family>Gleis SemiBold Condensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Bahnschrift Light Condensed</family>
    <accept><family>Gleis Light Condensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Bahnschrift SemiCondensed</family>
    <accept><family>Gleis SemiCondensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Bahnschrift Condensed</family>
    <accept><family>Gleis Condensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Bahnschrift SemiLight</family>
    <accept><family>Gleis SemiLight</family></accept>
  </alias>
  <alias binding="same">
    <family>Bahnschrift SemiBold</family>
    <accept><family>Gleis SemiBold</family></accept>
  </alias>
  <alias binding="same">
    <family>Bahnschrift Light</family>
    <accept><family>Gleis Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Bahnschrift</family>
    <accept><family>Gleis</family></accept>
  </alias>
</fontconfig>
