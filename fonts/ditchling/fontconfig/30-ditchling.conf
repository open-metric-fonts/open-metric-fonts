<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Perpetua Titling MT</family>
    <accept><family>Ditchling Titling MT</family></accept>
  </alias>
  <alias binding="same">
    <family>Perpetua</family>
    <accept><family>Ditchling</family></accept>
  </alias>
</fontconfig>
