<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Rockwell Extra Bold</family>
    <accept><family>Quarry Extra Bold</family></accept>
  </alias>
  <alias binding="same">
    <family>Rockwell Condensed</family>
    <accept><family>Quarry Condensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Rockwell</family>
    <accept><family>Quarry</family></accept>
  </alias>
</fontconfig>
