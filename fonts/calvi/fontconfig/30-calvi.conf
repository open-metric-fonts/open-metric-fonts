<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Sagona ExtraLight</family>
    <accept><family>Calvi ExtraLight</family></accept>
  </alias>
  <alias binding="same">
    <family>Sagona Book</family>
    <accept><family>Calvi Book</family></accept>
  </alias>
  <alias binding="same">
    <family>Sagona</family>
    <accept><family>Calvi</family></accept>
  </alias>
</fontconfig>
