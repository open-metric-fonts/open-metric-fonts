<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Aptos ExtraBold</family>
    <accept><family>Morrow Sans ExtraBold</family></accept>
  </alias>
  <alias binding="same">
    <family>Aptos SemiBold</family>
    <accept><family>Morrow Sans SemiBold</family></accept>
  </alias>
  <alias binding="same">
    <family>Aptos Display</family>
    <accept><family>Morrow Sans Display</family></accept>
  </alias>
  <alias binding="same">
    <family>Aptos Narrow</family>
    <accept><family>Morrow Sans Narrow</family></accept>
  </alias>
  <alias binding="same">
    <family>Aptos Light</family>
    <accept><family>Morrow Sans Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Aptos Black</family>
    <accept><family>Morrow Sans Black</family></accept>
  </alias>
  <alias binding="same">
    <family>Aptos</family>
    <accept><family>Morrow Sans</family></accept>
  </alias>
</fontconfig>
