<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Sitka Subheading Semibold</family>
    <accept><family>Baranof Subheading Semibold</family></accept>
  </alias>
  <alias binding="same">
    <family>Sitka Display Semibold</family>
    <accept><family>Baranof Display Semibold</family></accept>
  </alias>
  <alias binding="same">
    <family>Sitka Heading Semibold</family>
    <accept><family>Baranof Heading Semibold</family></accept>
  </alias>
  <alias binding="same">
    <family>Sitka Banner Semibold</family>
    <accept><family>Baranof Banner Semibold</family></accept>
  </alias>
  <alias binding="same">
    <family>Sitka Small Semibold</family>
    <accept><family>Baranof Small Semibold</family></accept>
  </alias>
  <alias binding="same">
    <family>Sitka Text Semibold</family>
    <accept><family>Baranof Text Semibold</family></accept>
  </alias>
  <alias binding="same">
    <family>Sitka Subheading</family>
    <accept><family>Baranof Subheading</family></accept>
  </alias>
  <alias binding="same">
    <family>Sitka Display</family>
    <accept><family>Baranof Display</family></accept>
  </alias>
  <alias binding="same">
    <family>Sitka Heading</family>
    <accept><family>Baranof Heading</family></accept>
  </alias>
  <alias binding="same">
    <family>Sitka Banner</family>
    <accept><family>Baranof Banner</family></accept>
  </alias>
  <alias binding="same">
    <family>Sitka Small</family>
    <accept><family>Baranof Small</family></accept>
  </alias>
  <alias binding="same">
    <family>Sitka Text</family>
    <accept><family>Baranof Text</family></accept>
  </alias>
  <alias binding="same">
    <family>Sitka</family>
    <accept><family>Baranof</family></accept>
  </alias>
</fontconfig>
