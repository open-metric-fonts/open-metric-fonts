<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Trade Gothic Next HvyCd</family>
    <accept><family>Wharf HvyCd</family></accept>
  </alias>
  <alias binding="same">
    <family>Trade Gothic Next Light</family>
    <accept><family>Wharf Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Trade Gothic Next Cond</family>
    <accept><family>Wharf Cond</family></accept>
  </alias>
  <alias binding="same">
    <family>Trade Gothic Next</family>
    <accept><family>Wharf</family></accept>
  </alias>
</fontconfig>
