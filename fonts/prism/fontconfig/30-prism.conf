<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Lucida Sans Typewriter</family>
    <accept><family>Prism Sans Typewriter</family></accept>
  </alias>
  <alias binding="same">
    <family>Lucida Sans Unicode</family>
    <accept><family>Prism Sans Unicode</family></accept>
  </alias>
  <alias binding="same">
    <family>Lucida Calligraphy</family>
    <accept><family>Prism Calligraphy</family></accept>
  </alias>
  <alias binding="same">
    <family>Lucida Handwriting</family>
    <accept><family>Prism Handwriting</family></accept>
  </alias>
  <alias binding="same">
    <family>Lucida Console</family>
    <accept><family>Prism Console</family></accept>
  </alias>
  <alias binding="same">
    <family>Lucida Bright</family>
    <accept><family>Prism Bright</family></accept>
  </alias>
  <alias binding="same">
    <family>Lucida Sans</family>
    <accept><family>Prism Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Lucida Fax</family>
    <accept><family>Prism Fax</family></accept>
  </alias>
</fontconfig>
