<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Franklin Gothic Medium Cond</family>
    <accept><family>Leyden Medium Cond</family></accept>
  </alias>
  <alias binding="same">
    <family>Franklin Gothic Demi Cond</family>
    <accept><family>Leyden Demi Cond</family></accept>
  </alias>
  <alias binding="same">
    <family>Franklin Gothic Medium</family>
    <accept><family>Leyden Medium</family></accept>
  </alias>
  <alias binding="same">
    <family>Franklin Gothic Heavy</family>
    <accept><family>Leyden Heavy</family></accept>
  </alias>
  <alias binding="same">
    <family>Franklin Gothic Book</family>
    <accept><family>Leyden Book</family></accept>
  </alias>
  <alias binding="same">
    <family>Franklin Gothic Demi</family>
    <accept><family>Leyden Demi</family></accept>
  </alias>
</fontconfig>
