<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Rockwell Nova Light</family>
    <accept><family>Quarry Nova Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Rockwell Nova Cond</family>
    <accept><family>Quarry Nova Cond</family></accept>
  </alias>
  <alias binding="same">
    <family>Rockwell Nova</family>
    <accept><family>Quarry Nova</family></accept>
  </alias>
</fontconfig>
