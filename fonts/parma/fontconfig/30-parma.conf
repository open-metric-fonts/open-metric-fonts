<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use these fonts wherever a document asks for the metric-compatible original.
     Install: copy to /etc/fonts/conf.d/ (or ~/.config/fontconfig/conf.d/), run fc-cache -f. -->
<fontconfig>
  <alias binding="same">
    <family>Bodoni MT Poster Compressed</family>
    <accept><family>Parma Poster Compressed</family></accept>
  </alias>
  <alias binding="same">
    <family>Bodoni MT Condensed</family>
    <accept><family>Parma Condensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Bodoni MT Black</family>
    <accept><family>Parma Black</family></accept>
  </alias>
  <alias binding="same">
    <family>Bodoni MT</family>
    <accept><family>Parma</family></accept>
  </alias>
</fontconfig>
